<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Platform Chat</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: #0e1117;
        color: #e7ebf3;
      }
      header {
        padding: 16px 20px;
        border-bottom: 1px solid #293244;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      nav a {
        color: #9ecbff;
        text-decoration: none;
        margin-right: 14px;
        font-size: 13px;
      }
      main {
        max-width: 980px;
        margin: 0 auto;
        padding: 18px;
      }
      .chat-shell {
        border: 1px solid #2e3d54;
        border-radius: 10px;
        background: #131a24;
        overflow: hidden;
      }
      .messages {
        min-height: 420px;
        max-height: 62vh;
        overflow: auto;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .msg {
        max-width: 72%;
        padding: 10px 12px;
        border-radius: 10px;
        line-height: 1.4;
        white-space: pre-wrap;
      }
      .msg.user {
        align-self: flex-end;
        background: #1f3253;
        border: 1px solid #36598d;
      }
      .msg.system {
        align-self: flex-start;
        background: #1b2638;
        border: 1px solid #3b4d68;
      }
      .composer {
        border-top: 1px solid #2e3d54;
        padding: 12px;
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
      }
      textarea {
        border-radius: 8px;
        border: 1px solid #3a4e6c;
        background: #0f1520;
        color: #e7ebf3;
        padding: 10px;
        font-size: 14px;
        resize: vertical;
        min-height: 52px;
      }
      button {
        border-radius: 8px;
        border: 1px solid #3f5d8d;
        background: #234170;
        color: #fff;
        padding: 0 18px;
        cursor: pointer;
      }
      .status {
        margin-top: 8px;
        font-size: 12px;
        color: #9fb0c8;
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <strong>User Chat</strong>
        <nav>
          <a href="/chat">User Chat</a>
          <a href="/ops">Ops View</a>
          <a href="/chat-admin">Chat Module Manager</a>
        </nav>
      </div>
      <div class="status" id="status">Ready</div>
    </header>

    <main>
      <div class="chat-shell">
        <div class="messages" id="messages"></div>
        <div class="composer">
          <textarea id="message-input" placeholder="Ask the system for help..."></textarea>
          <button id="send-btn">Send</button>
        </div>
      </div>
      <div class="status">Internal orchestration is abstracted; this view only shows user ↔ system conversation.</div>
    </main>

    <script>
      const messages = document.getElementById("messages");
      const input = document.getElementById("message-input");
      const sendBtn = document.getElementById("send-btn");
      const status = document.getElementById("status");
      let conversationId = crypto.randomUUID();

      function addMessage(role, text) {
        const el = document.createElement("div");
        el.className = `msg ${role}`;
        el.textContent = text;
        messages.appendChild(el);
        messages.scrollTop = messages.scrollHeight;
      }

      async function sendMessage() {
        const text = input.value.trim();
        if (!text) return;
        input.value = "";
        addMessage("user", text);
        status.textContent = "Processing...";

        try {
          const response = await fetch("/chat/message", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text, conversationId })
          });
          const body = await response.json();
          if (!response.ok) {
            addMessage("system", `Request failed: ${body.error || "unknown-error"}`);
            status.textContent = "Error";
            return;
          }

          conversationId = body.conversationId || conversationId;
          addMessage("system", body.reply || "No response.");
          status.textContent = "Ready";
        } catch (error) {
          addMessage("system", `Network error: ${String(error)}`);
          status.textContent = "Disconnected";
        }
      }

      sendBtn.addEventListener("click", sendMessage);
      input.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          sendMessage();
        }
      });

      addMessage("system", "Hello — ask anything and I’ll handle orchestration internally.");
    </script>
  </body>
</html>

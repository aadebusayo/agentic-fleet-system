name: reuse-build

on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Build control-plane
        working-directory: control-plane
        run: |
          npm ci
          npm run build
      - name: Build backend and sandbox packages
        run: |
          python -m pip install -e ./backend[dev]
          python -m pip install -e ./sandbox-agent[dev]
      - name: Build agent-fleet
        working-directory: agent-fleet
        run: go build ./...

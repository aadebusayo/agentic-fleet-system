name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Backend checks
        working-directory: backend
        run: |
          python -m pip install -e .[dev]
          pytest -q
      - name: Sandbox checks
        working-directory: sandbox-agent
        run: |
          python -m pip install -e .[dev]
          pytest -q
      - name: Control-plane checks
        working-directory: control-plane
        run: |
          npm ci
          npm test
          npm run build
      - name: Agent-fleet checks
        working-directory: agent-fleet
        run: go test ./...
      - name: Terraform validate
        working-directory: infra/terraform/environments/dev
        run: |
          terraform init -backend=false
          terraform validate

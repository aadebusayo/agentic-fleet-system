name: test

on:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Backend tests
        working-directory: backend
        run: python -m pip install -e .[dev] && pytest -q
      - name: Sandbox tests
        working-directory: sandbox-agent
        run: python -m pip install -e .[dev] && pytest -q
      - name: Control-plane tests
        working-directory: control-plane
        run: npm ci && npm test
      - name: Agent-fleet tests
        working-directory: agent-fleet
        run: go test ./...

services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./.env.local
    environment:
      - CONTROL_PLANE_BASE_URL=http://control-plane:8081
      - AGENT_LLM_PROVIDER=${AGENT_LLM_PROVIDER}
      - AGENT_LLM_MODEL=${AGENT_LLM_MODEL}
      - AGENT_LLM_TEMPERATURE=${AGENT_LLM_TEMPERATURE}
      - AGENT_LLM_MAX_TOKENS=${AGENT_LLM_MAX_TOKENS}
      - AGENT_LLM_TIMEOUT_SECONDS=${AGENT_LLM_TIMEOUT_SECONDS}
      - AGENT_LLM_ENDPOINT=${AGENT_LLM_ENDPOINT}
      - AGENT_LLM_API_KEY=${AGENT_LLM_API_KEY}
      - AGENT_AZURE_OPENAI_DEPLOYMENT=${AGENT_AZURE_OPENAI_DEPLOYMENT}
      - AGENT_AZURE_OPENAI_API_VERSION=${AGENT_AZURE_OPENAI_API_VERSION}
      - AGENT_AZURE_OPENAI_ENDPOINT=${AGENT_AZURE_OPENAI_ENDPOINT}
      - AGENT_AZURE_OPENAI_API_KEY=${AGENT_AZURE_OPENAI_API_KEY}
      - AGENT_ANTHROPIC_API_KEY=${AGENT_ANTHROPIC_API_KEY}
      - AGENT_ANTHROPIC_ENDPOINT=${AGENT_ANTHROPIC_ENDPOINT}
      - AGENT_ANTHROPIC_VERSION=${AGENT_ANTHROPIC_VERSION}
      - AGENT_GEMINI_API_KEY=${AGENT_GEMINI_API_KEY}
      - AGENT_GEMINI_ENDPOINT=${AGENT_GEMINI_ENDPOINT}
      - AGENT_LOCAL_LLM_ENDPOINT=${AGENT_LOCAL_LLM_ENDPOINT}
      - AGENT_LOCAL_LLM_FORMAT=${AGENT_LOCAL_LLM_FORMAT}
      - AGENT_LOCAL_LLM_API_KEY=${AGENT_LOCAL_LLM_API_KEY}
      - AGENT_ALLOW_STUB_LLM=${AGENT_ALLOW_STUB_LLM}
    ports:
      - "8080:8080"
    depends_on:
      - control-plane

  control-plane:
    build:
      context: ./control-plane
    env_file:
      - ./.env.local
    environment:
      - BACKEND_BASE_URL=http://backend:8080
      - SANDBOX_AGENT_BASE_URL=http://sandbox-agent:8083
    ports:
      - "8081:8081"

  agent-fleet:
    build:
      context: ./agent-fleet
    environment:
      - CONTROL_PLANE_BASE_URL=http://control-plane:8081
    ports:
      - "8082:8082"
    depends_on:
      - control-plane

  sandbox-agent:
    build:
      context: ./sandbox-agent
    env_file:
      - ./.env.local
    environment:
      - CONTROL_PLANE_BASE_URL=http://control-plane:8081
      - AGENT_LLM_PROVIDER=${AGENT_LLM_PROVIDER}
      - AGENT_LLM_MODEL=${AGENT_LLM_MODEL}
      - AGENT_LLM_TEMPERATURE=${AGENT_LLM_TEMPERATURE}
      - AGENT_LLM_MAX_TOKENS=${AGENT_LLM_MAX_TOKENS}
      - AGENT_LLM_TIMEOUT_SECONDS=${AGENT_LLM_TIMEOUT_SECONDS}
      - AGENT_LLM_ENDPOINT=${AGENT_LLM_ENDPOINT}
      - AGENT_LLM_API_KEY=${AGENT_LLM_API_KEY}
      - AGENT_AZURE_OPENAI_DEPLOYMENT=${AGENT_AZURE_OPENAI_DEPLOYMENT}
      - AGENT_AZURE_OPENAI_API_VERSION=${AGENT_AZURE_OPENAI_API_VERSION}
      - AGENT_AZURE_OPENAI_ENDPOINT=${AGENT_AZURE_OPENAI_ENDPOINT}
      - AGENT_AZURE_OPENAI_API_KEY=${AGENT_AZURE_OPENAI_API_KEY}
      - AGENT_ANTHROPIC_API_KEY=${AGENT_ANTHROPIC_API_KEY}
      - AGENT_ANTHROPIC_ENDPOINT=${AGENT_ANTHROPIC_ENDPOINT}
      - AGENT_ANTHROPIC_VERSION=${AGENT_ANTHROPIC_VERSION}
      - AGENT_GEMINI_API_KEY=${AGENT_GEMINI_API_KEY}
      - AGENT_GEMINI_ENDPOINT=${AGENT_GEMINI_ENDPOINT}
      - AGENT_LOCAL_LLM_ENDPOINT=${AGENT_LOCAL_LLM_ENDPOINT}
      - AGENT_LOCAL_LLM_FORMAT=${AGENT_LOCAL_LLM_FORMAT}
      - AGENT_LOCAL_LLM_API_KEY=${AGENT_LOCAL_LLM_API_KEY}
      - AGENT_ALLOW_STUB_LLM=${AGENT_ALLOW_STUB_LLM}
    ports:
      - "8083:8083"
    depends_on:
      - control-plane
